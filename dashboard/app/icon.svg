<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Leather-brown background -->
  <rect width="32" height="32" rx="6" fill="#6B2A0C"/>
  <!-- Subtle inner vignette -->
  <rect x="1" y="1" width="30" height="30" rx="5.2" fill="none"
        stroke="#C07840" stroke-width="0.6" opacity="0.35"/>
  <!-- DADA wordmark -->
  <text
    x="16" y="20"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="900"
    font-size="11.5"
    fill="#F2D4A8"
    text-anchor="middle"
    letter-spacing="1.8"
  >DADA</text>
  <!-- Thin rule below -->
  <line x1="8" y1="23" x2="24" y2="23" stroke="#C07840" stroke-width="0.6" opacity="0.6"/>
  <!-- BC sub-text -->
  <text
    x="16" y="28.5"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="4"
    fill="#C07840"
    text-anchor="middle"
    letter-spacing="2"
  >BC</text>
</svg>
