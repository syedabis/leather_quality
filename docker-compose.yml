# All credentials and image tags come from the .env file next to this compose file.
# SQL Server runs externally at 172.16.0.2\SQLEXPRESS — no sqlserver container needed.
# To deploy on a new machine: docker compose pull && docker compose up -d

services:
  backend:
    image: ${BACKEND_IMAGE:-datacrumbs762/spray-plant-backend}:${IMAGE_TAG:-latest}
    container_name: spray-plant-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      DB_SERVER: 172.16.0.2\SQLEXPRESS
      DB_NAME: ${DB_NAME:-nEXP1314}
      DB_USER: ${DB_USER:-dadasa}
      DB_PASSWORD: ${DB_PASSWORD}
      # Container default is UTC. Force the local plant timezone so
      # datetime.now() (used for break-window / holiday / off-day checks)
      # matches the inference machine and SQL Server clocks.
      TZ: ${TZ:-Asia/Karachi}
      # Used to derive the Clerk issuer/JWKS URL for verifying session JWTs.
      CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    networks:
      - spray-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/db')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard:
    image: ${FRONTEND_IMAGE:-datacrumbs762/spray-plant-dashboard}:${IMAGE_TAG:-latest}
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    container_name: spray-plant-dashboard
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_started
    networks:
      - spray-net

networks:
  spray-net:
    driver: bridge
